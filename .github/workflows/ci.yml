name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    name: Lint, typecheck e testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Sem `version`: o action usa package.json#packageManager (pnpm@10.32.1).
        # Declarar os dois ao mesmo tempo quebra o job com ERR_PNPM_BAD_PM_VERSION.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

      # Por último por ser o passo mais lento: lint, typecheck e testes dão o
      # retorno rápido primeiro. Roda sem nenhum segredo, porque o cliente
      # admin do Supabase passou a ser criado sob demanda e não no import.
      - name: Build
        run: pnpm build
